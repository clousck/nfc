# Stack de Dockge para el panel admin en la Raspberry Pi.
#
# 1. Construir la imagen en la Pi (desde la raíz del repo):
#      docker build -f apps/admin/Dockerfile -t nfc-admin:latest .
# 2. Crear el stack en Dockge pegando este archivo y un .env basado en .env.example.
# 3. Crear el directorio de datos con dueño uid 1000 (usuario `node` del contenedor):
#      sudo mkdir -p /opt/nfc-admin/data && sudo chown 1000:1000 /opt/nfc-admin/data
#
# El puerto solo se publica en 127.0.0.1: el acceso externo entra por cloudflared
# (admin.penginexr.com → http://localhost:3000) detrás de Cloudflare Access.

name: nfc-admin

services:
  admin:
    image: nfc-admin:latest
    platform: linux/arm64
    container_name: nfc-admin
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_PATH: /data/admin.db
    volumes:
      # La base activa vive en la SD/SSD; /mnt/usb es solo destino de backups.
      - ${NFC_DATA_DIR:-/opt/nfc-admin/data}:/data
    ports:
      - '127.0.0.1:3000:3000'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
