# Stack de Dockge para el panel admin en la Raspberry Pi.
#
# 1. Construir la imagen en la Pi (desde la raíz del repo):
#      docker build -f apps/admin/Dockerfile -t nfc-admin:latest .
# 2. Crear el stack en Dockge pegando este archivo y un .env basado en .env.example.
# 3. Crear el directorio de datos con dueño uid 1000 (usuario `node` del contenedor):
#      sudo mkdir -p /opt/nfc-admin/data && sudo chown 1000:1000 /opt/nfc-admin/data
#
# Acceso externo: el contenedor `cloudflared` ya existente (túnel con token) se une
# a la misma red Docker y llega al panel por nombre. En el dashboard de Cloudflare,
# el public hostname del túnel es:
#   admin.penginexr.com → http://nfc-admin:3000   (detrás de Cloudflare Access)
# No se publica ningún puerto en la Pi.

name: nfc-admin

services:
  admin:
    image: nfc-admin:latest
    platform: linux/arm64
    container_name: nfc-admin
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_PATH: /data/admin.db
    volumes:
      # La base activa vive en la SD/SSD; /mnt/usb es solo destino de backups.
      - ${NFC_DATA_DIR:-/opt/nfc-admin/data}:/data
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  # Red del stack de cloudflared. Comprobar el nombre con `docker network ls`.
  tunnel:
    external: true
    name: ${CLOUDFLARED_NETWORK:-cloudflared_default}
