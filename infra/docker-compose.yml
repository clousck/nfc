# Stack de Dockge para el panel admin en la Raspberry Pi.
#
# 1. Imagen: la construye GitHub Actions en cada push a main y la publica en
#      ghcr.io/clousck/nfc-admin:latest   (y :sha-<commit> para volver a una versión anterior)
#    Para actualizar: botón "Update" del stack en Dockge (descarga la imagen y reinicia).
#    Alternativa sin GitHub: construirla en la Pi desde la raíz del repo y poner
#    NFC_ADMIN_IMAGE=nfc-admin:latest en el .env:
#      docker build -f apps/admin/Dockerfile -t nfc-admin:latest .
# 2. Crear el stack en Dockge pegando este archivo y un .env basado en .env.example.
# 3. Crear el directorio de datos con dueño uid 1000 (usuario `node` del contenedor):
#      sudo mkdir -p /opt/nfc-admin/data && sudo chown 1000:1000 /opt/nfc-admin/data
#
# Acceso externo: túnel propio de Cloudflare (TUNNEL_TOKEN en el .env), independiente
# de los demás servicios de la Pi. En el dashboard, la ruta del túnel es:
#   nfc-admin.penginexr.com → http://nfc-admin:3000   (detrás de Cloudflare Access)
# No se publica ningún puerto en la Pi.

name: nfc-admin

services:
  admin:
    image: ${NFC_ADMIN_IMAGE:-ghcr.io/clousck/nfc-admin:latest}
    platform: linux/arm64
    container_name: nfc-admin
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_PATH: /data/admin.db
    volumes:
      # La base activa vive en la SD/SSD; /mnt/usb es solo destino de backups.
      - ${NFC_DATA_DIR:-/opt/nfc-admin/data}:/data
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nfc-admin-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN en el .env}
    depends_on:
      - admin
    logging: *logging
