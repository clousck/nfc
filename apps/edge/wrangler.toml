name = "nfc-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Dominio público: Cloudflare crea el registro DNS de go.penginexr.com al desplegar.
routes = [{ pattern = "go.penginexr.com", custom_domain = true }]

[vars]
# Ecuador no tiene horario de verano: UTC-5 fijo.
REPORT_TZ_OFFSET_MINUTES = "-300"

[observability]
enabled = true

# KV con los registros publicados por el admin: clave <slug> → LinkRecord (JSON).
# Creado con `wrangler kv namespace create LINKS`.
[[kv_namespaces]]
binding = "LINKS"
id = "df1b42020b384db6bcfe767d80ebe59d"

# D1 con los escaneos. Creada con `wrangler d1 create nfc-scans`.
[[d1_databases]]
binding = "DB"
database_name = "nfc-scans"
database_id = "c7d538b5-69cf-44d1-a370-bef14e00bfb2"
migrations_dir = "../../infra/d1/migrations"
