name = "nfc-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Dominios del Worker: Cloudflare crea sus registros DNS y certificados al desplegar.
#   go.penginexr.com       → chips, páginas del cliente y /internal/* (la Pi)
#   negocios.penginexr.com → portal de los negocios (solo eso; /internal no responde ahí)
routes = [
  { pattern = "go.penginexr.com", custom_domain = true },
  { pattern = "negocios.penginexr.com", custom_domain = true },
]

# Estáticos (public/, generado por scripts/vendor.mjs; no se versiona): solo el lector de QR
# para iPhone. Lo que no es un fichero de public/ lo atiende el Worker.
[build]
command = "node scripts/vendor.mjs"

[assets]
directory = "./public"

[vars]
# Ecuador no tiene horario de verano: UTC-5 fijo.
REPORT_TZ_OFFSET_MINUTES = "-300"
# observe = registra lo que se habría bloqueado, pero deja pasar. enforce = bloquea (429).
# Pasar a enforce tras revisar 2–4 semanas de incidentes (docs/SECURITY.md §4).
RATE_LIMIT_MODE = "observe"
# Portal de los negocios (mismo Worker, otro hostname). Se usa para los enlaces de acceso.
PORTAL_ORIGIN = "https://negocios.penginexr.com"
MAIL_FROM = "PengineXR <acceso@penginexr.com>"
# Aviso de "stand perdido": valor por defecto; se puede cambiar en Ajustes del panel.
ADMIN_NOTIFY_EMAIL = "victor.ees.ec@gmail.com"

# Limpieza diaria (03:00 de Ecuador): incidentes de más de 90 días y sales de días pasados.
[triggers]
crons = ["0 8 * * *"]

# Límites de peticiones (ventana de 60 s; contadores por centro de datos, aproximados).
# namespace_id: entero único por límite dentro de la cuenta.
[[ratelimits]]
name = "RL_DEVICE"        # por móvil (cookie): alta y canje
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_NETWORK"       # por IP + negocio: red de seguridad contra scripts
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_STAFF"         # personal validando canjes: 3× el límite público
namespace_id = "1003"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "RL_INCIDENT_LOG"  # como mucho 1 incidente registrado por minuto y origen
namespace_id = "1004"
simple = { limit = 1, period = 60 }

[[ratelimits]]
name = "RL_LOGIN"         # pedir enlace de acceso al portal, por correo
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[observability]
enabled = true

# KV con los registros publicados por el admin: clave <slug> → LinkRecord (JSON).
# Creado con `wrangler kv namespace create LINKS`.
[[kv_namespaces]]
binding = "LINKS"
id = "df1b42020b384db6bcfe767d80ebe59d"

# D1 con los escaneos. Creada con `wrangler d1 create nfc-scans`.
[[d1_databases]]
binding = "DB"
database_name = "nfc-scans"
database_id = "c7d538b5-69cf-44d1-a370-bef14e00bfb2"
migrations_dir = "../../infra/d1/migrations"
